# MeowArch zorn release policy.
#
# Do not allow a normal pacman transaction to replace the kernel package or
# the firmware set that was validated with the booted Image and DTB. The
# exact versions are recorded in profiles/zorn/packages.protected.tsv.
#
# Keep the explicit names as well as the wildcard: the names make the policy
# visible to humans and the wildcard covers newly split linux-firmware files.
IgnorePkg = linux linux-aarch64 linux-headers linux-aarch64-headers linux-lts linux-lts-headers linux-zen linux-zen-headers
IgnorePkg = linux-api-headers
IgnorePkg = linux-firmware linux-firmware-*
IgnorePkg = wireless-regdb
